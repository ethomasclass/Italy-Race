<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Leg 1 — Tuscan Hills</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c8c4ae; }
  canvas { display: block; }

  #ui {
    position: fixed; inset: 0; pointer-events: none;
    font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #f2ede0; text-shadow: 0 1px 3px rgba(0,0,0,.55);
  }
  #hud {
    position: absolute; left: 20px; bottom: 18px;
    letter-spacing: .04em; opacity: .92;
  }
  #hud b { font-weight: 700; font-size: 15px; }
  #hud i { opacity: .7; font-style: normal; }
  #hud span { display: inline-block; width: 18px; }

  #keys {
    position: absolute; right: 20px; bottom: 18px;
    text-align: right; opacity: .55; font-size: 11px; letter-spacing: .06em;
  }

  #subtitle {
    position: absolute; left: 50%; bottom: 68px; transform: translateX(-50%);
    max-width: min(760px, 82vw); text-align: center;
    font: 400 17px/1.55 Georgia, 'Times New Roman', serif;
    letter-spacing: .01em; opacity: 0; transition: opacity .5s ease;
  }
  #subtitle.visible { opacity: .95; }

  #hint {
    position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase; opacity: .7;
    transition: opacity .5s ease;
  }
  body.driving #hint { opacity: 0; }

  #status {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font-size: 12px; letter-spacing: .18em; text-transform: uppercase; opacity: .8;
  }
</style>
</head>
<body>
  <div id="ui">
    <div id="status">Loading</div>
    <div id="hud"></div>
    <div id="subtitle"></div>
    <div id="keys">W / S &nbsp; throttle · brake<br>A / D &nbsp; steer<br>C &nbsp; chase ⇄ cockpit<br>R &nbsp; restart</div>
    <div id="hint">Press any control to drive</div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
